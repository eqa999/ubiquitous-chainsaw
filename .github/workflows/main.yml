name: Windows RDP via Tailscale

on: [push]

jobs:
  rdp-setup:
    runs-on: windows-latest
    timeout-minutes: 360  # الحد الأقصى 6 ساعات

    steps:
    - name: تفعيل RDP وقواعد جدار الحماية
      run: |
        Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        New-NetFirewallRule -DisplayName "Allow RDP" -Direction Inbound -Action Allow -Protocol TCP -LocalPort 3389
        Restart-Service -Name TermService -Force

    - name: إنشاء مستخدم مدير
      run: |
        net user kamel007 Kamel@123 /add
        net localgroup administrators kamel007 /add

    - name: تثبيت Tailscale
      run: |
        winget install --id=Tailscale.Tailscale --exact --silent --accept-package-agreements --accept-source-agreements
        Start-Sleep -Seconds 5

    - name: تسجيل الدخول إلى شبكة Tailscale
      run: |
        $tailscalePath = "${env:ProgramFiles}\Tailscale\tailscale.exe"
        if (-not (Test-Path $tailscalePath)) {
          $tailscalePath = (Get-Command tailscale -ErrorAction SilentlyContinue).Source
          if (-not $tailscalePath) {
            Write-Error "لم يتم العثور على tailscale.exe"
            exit 1
          }
        }
        # المفتاح مضمن هنا مباشرةً
        & $tailscalePath up --auth-key "tskey-auth-kTiLGuD1pp11CNTRL-5hKu5f3Eze6Z2t9sBixFf6egm79WDhYM" --hostname "github-rdp-runner" --accept-routes --accept-dns=false

    - name: عرض معلومات الاتصال
      run: |
        $tailscalePath = "${env:ProgramFiles}\Tailscale\tailscale.exe"
        if (-not (Test-Path $tailscalePath)) {
          $tailscalePath = (Get-Command tailscale -ErrorAction SilentlyContinue).Source
        }
        $tailscaleIP = & $tailscalePath ip -4 2>$null
        if (-not $tailscaleIP) {
          Write-Output "::error::فشل في الحصول على عنوان IP من Tailscale. تأكد من أن الاتصال نشط."
          exit 1
        }

        Write-Output "============================================================"
        Write-Output "||           ✅  تفاصيل اتصال RDP عبر Tailscale          ||"
        Write-Output "============================================================"
        Write-Output ""
        Write-Output "   عنوان الـ IP داخل شبكة Tailscale: $tailscaleIP"
        Write-Output "   اسم المستخدم: kamel007"
        Write-Output "   كلمة المرور: Kamel@123"
        Write-Output ""
        Write-Output "----------------------------------"
        Write-Output "طريقة الاتصال:"
        Write-Output "1. تأكد من تثبيت Tailscale على جهازك المحلي وتسجيل الدخول بنفس الحساب."
        Write-Output "2. اضغط Win + R، واكتب 'mstsc' واضغط Enter."
        Write-Output "3. في حقل الكمبيوتر، اكتب عنوان IP الظاهر أعلاه: $tailscaleIP"
        Write-Output "4. استخدم بيانات الدخول المذكورة."
        Write-Output "============================================================"

    - name: إبقاء الـ runner نشطاً (لمدة 6 ساعات)
      run: |
        Write-Output "سيتم الحفاظ على الاتصال لمدة 6 ساعات (المهلة القصوى)."
        Start-Sleep -Seconds 21600   # 6 ساعات
