name: 💀 Windows RDP ULTIMATE (Tailscale Fixed)

on: [push]

jobs:
  rdp-setup:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    # ============================================================
    # 1. تحرير الموارد
    # ============================================================
    - name: ⚡ تعطيل الخدمات الثقيلة
      run: |
        Stop-Service -Name "SysMain" -Force -ErrorAction SilentlyContinue
        Set-Service -Name "SysMain" -StartupType Disabled -ErrorAction SilentlyContinue
        Stop-Service -Name "WSearch" -Force -ErrorAction SilentlyContinue
        Set-Service -Name "WSearch" -StartupType Disabled -ErrorAction SilentlyContinue

    # ============================================================
    # 2. إعدادات RDP
    # ============================================================
    - name: 🚀 تفعيل RDP الاحترافي
      run: |
        Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0
        Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "UserAuthentication" -Value 0
        Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "GraphicsProfile" -Value 3
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        New-NetFirewallRule -DisplayName "Allow RDP" -Direction Inbound -Action Allow -Protocol TCP -LocalPort 3389

    # ============================================================
    # 3. إنشاء مستخدم وكلمة مرور قوية
    # ============================================================
    - name: 🔑 إنشاء حساب Admin
      id: credentials
      run: |
        $chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()_+'
        $password = -join ((1..16) | ForEach { Get-Random -Maximum $chars.Length | ForEach { $chars[$_] } })
        $securePassword = ConvertTo-SecureString $password -AsPlainText -Force
        New-LocalUser -Name "UltraAdmin" -Password $securePassword -FullName "Ultra Admin"
        Add-LocalGroupMember -Group "Administrators" -Member "UltraAdmin"
        echo "PASSWORD=$password" >> $env:GITHUB_ENV
        echo "USERNAME=UltraAdmin" >> $env:GITHUB_ENV

    # ============================================================
    # 4. عرض مواصفات الجهاز
    # ============================================================
    - name: 🖥️ عرض المواصفات
      run: |
        Write-Output "=================================================="
        Write-Output "🖥️  مواصفات الجهاز الافتراضي:"
        $OS = Get-ComputerInfo -Property OsName, OsVersion
        Write-Output "🟢 نظام التشغيل: $($OS.OsName) ($($OS.OsVersion))"
        $CPU = Get-WmiObject -Class Win32_Processor
        Write-Output "🟢 المعالج: $($CPU.Name.Trim()) (أنوية: $($CPU.NumberOfCores))"
        $RAM = Get-WmiObject -Class Win32_PhysicalMemory
        Write-Output "🟢 الرام: $([math]::Round(($RAM | Measure-Object Capacity -Sum).Sum / 1GB, 2)) جيجابايت"
        Write-Output "=================================================="

    # ============================================================
    # 5. تثبيت Tailscale بطريقة غير تفاعلية (بدون winget)
    # ============================================================
    - name: 🔗 تثبيت Tailscale يدوياً (MSI)
      id: tailscale_install
      run: |
        Write-Output "[1/3] تحميل أحدث إصدار من Tailscale (MSI)..."
        $msiUrl = "https://pkgs.tailscale.com/stable/windows/tailscale-setup-latest.msi"
        $msiPath = "$env:TEMP\tailscale.msi"
        Invoke-WebRequest -Uri $msiUrl -OutFile $msiPath -UseBasicParsing
        
        Write-Output "[2/3] تثبيت الملف بصمت (/quiet /norestart)..."
        Start-Process msiexec.exe -Wait -ArgumentList "/i `"$msiPath`" /quiet /norestart"
        Remove-Item $msiPath -Force -ErrorAction SilentlyContinue
        
        Write-Output "[3/3] تحديث متغير PATH للجلسة الحالية..."
        # إضافة مسار تثبيت Tailscale إلى PATH (عادةً في Program Files)
        $tailscalePath = "${env:ProgramFiles}\Tailscale"
        if (Test-Path $tailscalePath) {
            $env:Path = "$tailscalePath;$env:Path"
            # أيضاً نضيفه بشكل دائم للمستخدم
            [Environment]::SetEnvironmentVariable("Path", $env:Path, [EnvironmentVariableTarget]::User)
        } else {
            Write-Output "::error::فشل التثبيت - لم يتم العثور على مجلد Tailscale"
            exit 1
        }
        
        # التحقق من أن الأمر أصبح متاحاً
        Write-Output "[✔] التحقق من التثبيت:"
        tailscale --version

    # ============================================================
    # 6. تسجيل الدخول إلى Tailscale بالمفتاح المضمن
    # ============================================================
    - name: 🔗 تشغيل Tailscale
      id: tailscale_up
      run: |
        # تأكد من وجود المسار مرة أخرى (احتياطياً)
        $tailscalePath = "${env:ProgramFiles}\Tailscale"
        if (Test-Path $tailscalePath) {
            $env:Path = "$tailscalePath;$env:Path"
        }
        
        Write-Output "[1/2] الاتصال بشبكة Tailscale..."
        tailscale up --auth-key "tskey-auth-kPCgH6i34221CNTRL-aLqtKEywjvhzF1nzXsf1whfadoYrk1DuW" --hostname "ultimate-rdp-runner" --accept-routes --accept-dns
        
        Start-Sleep -Seconds 8
        Write-Output "[2/2] جلب عنوان IP..."
        $IP = tailscale ip -4
        if ($IP) {
          echo "TAILSCALE_IP=$IP" >> $env:GITHUB_ENV
          Write-Output "[✅] تم الاتصال بنجاح! الـ IP: $IP"
        } else {
          Write-Output "::error::فشل الحصول على IP من Tailscale"
          exit 1
        }

    # ============================================================
    # 7. عرض بيانات الاتصال النهائية
    # ============================================================
    - name: 🎯 تفاصيل الاتصال
      run: |
        $ADDRESS = $env:TAILSCALE_IP
        $USER = "UltraAdmin"
        $PASS = $env:PASSWORD
        
        Write-Output "`n"
        Write-Output "████████████████████████████████████████████████████████████████"
        Write-Output "██              🚀 تم تشغيل RDP بنجاح 🚀                    ██"
        Write-Output "████████████████████████████████████████████████████████████████"
        Write-Output ""
        Write-Output "   📡  نوع الاتصال : ✅ TAILSCALE (خاص وآمن)"
        Write-Output "   🌐  العنوان     : $ADDRESS"
        Write-Output "   👤  المستخدم    : $USER"
        Write-Output "   🔑  كلمة المرور : $PASS"
        Write-Output ""
        Write-Output "────────────────────────────────────────────────────────────────"
        Write-Output "  📝 تعليمات الاتصال:"
        Write-Output "  1. تأكد من تثبيت Tailscale على جهازك المحلي."
        Write-Output "  2. اضغط Win + R واكتب 'mstsc'."
        Write-Output "  3. اكتب العنوان: $ADDRESS واستخدم البيانات أعلاه."
        Write-Output "────────────────────────────────────────────────────────────────"
        Write-Output "  ⏳ المهلة: 6 ساعات (الجلسة نشطة حتى الإلغاء اليدوي)"
        Write-Output "████████████████████████████████████████████████████████████████"

    # ============================================================
    # 8. إبقاء الجلسة نشطة
    # ============================================================
    - name: ⏳ الحفاظ على النشاط
      run: |
        while ($true) {
          Start-Sleep -Seconds 300
          Write-Output "[❤️] الجلسة لا تزال نشطة ..."
        }

    # ============================================================
    # 9. تنظيف
    # ============================================================
    - name: 🧹 تنظيف
      if: always()
      run: |
        $tailscalePath = "${env:ProgramFiles}\Tailscale"
        if (Test-Path $tailscalePath) { $env:Path = "$tailscalePath;$env:Path" }
        tailscale down --accept-risk=lose-ssh -ErrorAction SilentlyContinue
